<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Grid- it is used for 2D layouts -->
    <div style="display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 10px;">
        <div style="height:100px; width: 100px; background-color: red;"></div>
        <div style="height:100px; width: 100px; background-color: blue;"></div>
        <div style="height:100px; width: 100px; background-color: green;"></div>
        <div style="height:100px; width: 100px; background-color: yellow;"></div>
        <div style="height:100px; width: 100px; background-color: olivedrab;"></div>
        <div style="height:100px; width: 100px; background-color: turquoise;"></div>
    </div>
</body>
</html>
