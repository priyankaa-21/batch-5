<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <h1>Hello, world!</h1>
        <div class="container">
            <div class="row">
                <div class="box1 col-md-2">A</div>
                <div class="box2 col-md-2">B</div>
                <div class="box3 col-md-2">C</div>
            </div>
        </div>
        <div class="container">
            <div class="row">
                <div class="box1 col-md-3">A</div>
                <div class="box2 col-md-3">B</div>
                <div class="box3 col-md-3">C</div>
            </div>
        </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    
    <style>
        .box1{
            height: 100%;
            background-color: lightgray;
        }
        .box2{
            height: 100%;
            background-color: rgb(216, 226, 10);
        }
        .box3{
            height: 100%;
            background-color: rgb(215, 24, 24);
        }
    </style>
  </body>
</html>
