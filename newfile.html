        <legend>Personal Details</legend>

        <br>
        <label for="email">Email</label>

     <br>
     <br>
    <fieldset>

        <input type="text" >
        <br>
        <br>    
        <label for="pincode">Pincode</label>
        <input type="text" >
    </fieldset>
</body>
</html>
