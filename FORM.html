<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>SIGNUP & ONBOARDING FORM</h1>
    <br>
    <label for="name">Name:</label>
    <input type="text" id="name">
    <br>
    <br>
    <label for="father_name">Father's Name:</label>
    <input type="text" id="father_name">
    <br>
    <br>
    <label for="mother_name">Mother's Name:</label>
    <input type="text" id="mother_name">
    <br>
    <br>
    <label for="email">Email:</label>
    <input type="email" id="email">
    <br>
    <br>
    <label for="mobile_no">Phone Number:</label>
    <input type="number" id="mobile_no" maxlength="10">    
    <br>
    <br>
    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob">
    <br>
    <br>    
    <label for="blood_group">Blood Group:</label>
    <input type="text" id="blood_group">    
    <br>
    <br>
    <label for="course_work">Course:</label>
    <select name="course_work" id="course_work">
        <option value="BTech">Bachelor of Technology</option>
        <option value="MEAN">Mean Stack Development</option>
        <option value="Springboot">Spring Boot</option>
        <optgroup label="Others">
            <option value="MERN">MERN Stack Development</option>
            <option value="Python">Python Programming</option>
    </select>
    <br>
    <br>
    <label for="favorite_colour">Favorite Color:</label>
    <input type="color" id="favorite_colour">   
    <br>
    <br>    
    <label for="gender">Gender:</label>
    <input type="radio" name="gender" value="male"> Male    
    <input type="radio" name="gender" value="female"> Female
    <input type="radio" name="gender" value="other"> Other
    <br>    
    <br>
    <label for="graduation_year">Graduation Year:</label> 
    <input type="date" id="graduation_year">  
    <br>
    <br>
    <label for="profile_picture">Profile Picture:</label>
    <input type="file" id="profile_picture">    
    <br>
    <br>
     <label for="Reset"></label>
    <input type="reset" id="Reset" value="Reset">
    <label for="submit"></label>
    <input type="submit" id="submit" value="Submit">
</body>
</html>
