<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        #main{
            height: 300px;
            width: 300px;
            background-color: lightpink;
            position: relative;
            margin: auto;
        }
        #greet{
            text-align: center;
            padding-top: 50%;
        }
        #door1{
            height: 100%;
            width: 50%;
            background-color: rgb(212, 73, 73);
            position: absolute;
            top: 0%;
        }
         #door2{
            height: 100%;
            width: 50%;
            background-color: rgb(170, 160, 160);
            position: absolute;
            top: 0%;
            left: 50%;
        }
    </style>
</head>
<body>
    <main id="main">
    <h1 id="greet">Happy Birthday</h1>
    <div id="door1"></div>
    <div id="door2" ></div>

</main>
</body>
</html>
