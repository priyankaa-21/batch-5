<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label for="name">Name:</label>
    <input type="text" id="name">
    <br>
    <br>
    <label for="email">Email:</label>
    <input type="email" id="email">
    <br>
    <br>
    <label for="mobile_no">Contact</label>
    <input type="number" maxlength="10">
    <br>
    <br>
    <label for="course_work">Course Work:</label>
    <select name="course_work" id="course_work">
        <option value="MERN">MERN</option>
        <option value="MEAN">MEAN</option>
        <option value="Springboot">Spring Boot</option>
    </select>
    <br>
    <br>
    <input type="file">
    <br>
    <br>
    <label for="favorite_colour">Favorite Color:</label>
    <input type="color" id="favorite_colour">
    <br>
    <br>
    <label for="gender">Gender:</label>
    <input type="radio" name="gender" value="male"> Male
    <input type="radio" name="gender" value="female"> Female
    <input type="radio" name=" gender" value="other"> Other
    <br>
    <br>
    <label for="hobbies">Hobbies:</label>
    <input type="checkbox" id="hobbies" name="hobbies" value="reading">
    <label for="hobbies">Reading</label>
    <input type="checkbox" id="hobbies" name="hobbies" value="swimming">
    <label for="hobbies">Swimming</label>
    <input type="checkbox" id="hobbies" name="hobbies" value="travelling">
    <label for="hobbies">Travelling</label>
    <br>
    <br>
    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob">
    <br>
    <br>
    <label for="Reset"></label>
    <input type="reset" id="Reset" value="Reset">
    <label for="submit"></label>
    <input type="submit" id="submit" value="Submit">
</body>
</html>
