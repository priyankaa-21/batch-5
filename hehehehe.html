<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Descendent means that the child can have any level of nesting(Depth) and the styles are applicable for them */
        div p{
            color: red;
        }
    </style>
</head>
<body>
    <div>
        Grandparent
        <div>
            <p>Child1</p>
        </div>
        <section>
            <p>Child2</p>
        </section>
    </div>
</body>
</html>
