<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            height: 100px;
            width: 100px;
            background-color: red;
        }
        .box:hover{
            background-color: blue;
            transition:all 2s 0.4s;
        }
    </style>
</head>
<body>
    <!-- Transform- It is used to change the visual position, size, angle or shape of an element -->
    <!-- Transition- It is used to control how smoothly the changes occur --> 
     <div class="box"></div>
</body>
</html>
